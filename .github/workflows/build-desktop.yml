name: Build desktop & mobile

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Unit tests & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-downloads.mjs electron

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and handler tests
        run: npm test

  windows-package:
    name: Windows x64 installer
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [test]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The pinned helper toolchain (1.96.1) comes from
      # native/windows-managed-process-helper/rust-toolchain.toml; rustup
      # installs it automatically on the first cargo invocation.
      - name: Build application
        run: npm run build

      - name: Prepare verified bundled search tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-downloads.mjs tools win32-x64

      - name: Package Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: node scripts/ci-downloads.mjs builder --win nsis --x64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pi-desktop-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  android-package:
    name: Android APK & relay bundle
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Job-level env is the reliable way to branch on a secret: fork PRs and
      # repos without signing secrets fall back to the debug key (the gradle
      # build handles that), while pushes/tags sign with the upload keystore.
      ANDROID_KEYSTORE_SET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore upload keystore
        if: env.ANDROID_KEYSTORE_SET == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pi-remote-release.jks"

      - name: Run mobile tests
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pi-remote-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Verify APK signature
        if: env.ANDROID_KEYSTORE_SET == 'true'
        run: |
          set -euo pipefail
          apk="mobile/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          "$apksigner" verify "$apk"

      - name: Install npm dependencies for relay bundle
        run: npm ci

      - name: Build relay bundle
        run: node scripts/build-relay.mjs

      - name: Stage mobile artifacts
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist-mobile
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "dist-mobile/pi-remote-android-${version}.apk"
          cp out/relay/relay.mjs "dist-mobile/pi-relay-${version}.mjs"
          cp docs/relay-deploy.md dist-mobile/
          ls -la dist-mobile/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pi-desktop-android
          path: dist-mobile/*
          if-no-files-found: error
          retention-days: 14

  release-contract:
    name: Validate release contract
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release tag must point to a commit contained in main" >&2
            exit 1
          fi

          node <<'NODE'
          const packageJson = require("./package.json");
          const packageLock = require("./package-lock.json");

          if (!/^\d+\.\d+\.\d+$/.test(packageJson.version)) {
            throw new Error(
              `Stable release versions must use x.y.z without a prerelease suffix: ${packageJson.version}`,
            );
          }

          const expectedTag = `v${packageJson.version}`;
          const versions = [
            ["package-lock.json.version", packageLock.version],
            [
              'package-lock.json.packages[""].version',
              packageLock.packages?.[""]?.version,
            ],
          ];

          for (const [source, version] of versions) {
            if (version !== packageJson.version) {
              throw new Error(
                `${source} (${String(version)}) does not match package.json (${packageJson.version})`,
              );
            }
          }

          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(
              `Release tag ${process.env.GITHUB_REF_NAME} must exactly match ${expectedTag}`,
            );
          }

          console.log(`Validated release ${expectedTag}`);
          NODE

      - name: Refuse an existing public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$is_draft" != "true" ]; then
              echo "Release $GITHUB_REF_NAME is already public; published assets are immutable" >&2
              exit 1
            fi
          fi

      - name: Verify managed runtime catalog against upstream releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:toolchain-catalog:upstream

  release:
    name: Publish release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-contract, windows-package, android-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Publish release to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find release-artifacts -type f \( -name '*.exe' -o -name '*.apk' -o -name '*.mjs' -o -name '*.md' -o -name '*.blockmap' -o -name '*.yml' \) -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files were downloaded" >&2
            exit 1
          fi

          duplicates="$(printf '%s\n' "${files[@]##*/}" | sort | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "Duplicate release asset names:" >&2
            echo "$duplicates" >&2
            exit 1
          fi

          # Publish directly to the release feed (the artifact library); a
          # pre-existing draft (e.g. from electron-builder) is edited in place,
          # but an already-public release is immutable and fails the run.
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          elif gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null; then
            echo "Release $GITHUB_REF_NAME is already public; published assets are immutable" >&2
            exit 1
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag --latest
          fi
